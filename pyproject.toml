[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rl-2048-demo"
version = "0.1.0"
description = "A Gymnasium and MaskablePPO reinforcement-learning demo for 2048."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.0,<2.0",
    "moviepy>=2.0,<3.0",
    "numpy>=1.26,<3.0",
    "pygame-ce>=2.5,<3.0",
    "sb3-contrib>=2.4,<3.0",
    "stable-baselines3>=2.4,<3.0",
    "tensorboard>=2.0,<3.0",
    "wandb>=0.19,<1.0",
]

[dependency-groups]
dev = [
    "py-spy>=0.4.2",
    "pytest>=8.0,<9.0",
    "ruff>=0.8,<1.0",
]

[project.scripts]
rl-train = "rl2048.cli:train_command"
rl-play = "rl2048.cli:play_command"
rl-eval = "rl2048.cli:eval_command"
rl-check-env = "rl2048.cli:check_env_command"
rl-manual = "rl2048.cli:manual_command"

[tool.hatch.build.targets.wheel]
packages = ["src/rl2048"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
